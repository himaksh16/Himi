name: Build Rover Control APK and ESP32 firmware

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rover-control-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-firmware:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform and Libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ESP32Servo"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Compile Firmware
        run: |
          mkdir -p build_dir/RoverControl_V3_ESP32_Firmware
          cp firmware/RoverControl_V3_ESP32_Firmware.ino build_dir/RoverControl_V3_ESP32_Firmware/
          arduino-cli compile --fqbn esp32:esp32:esp32 build_dir/RoverControl_V3_ESP32_Firmware --output-dir build_dir/output

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rover-control-esp32-firmware
          path: build_dir/output/
